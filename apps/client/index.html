<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>APEX GHOST · Online sim racing</title>
    <meta name="description" content="Online multiplayer sim racing for friends, in your browser." />
    <meta name="theme-color" content="#0d0e11" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0e11'/%3E%3Cpath d='M6 24 16 6l10 18h-5l-5-9-5 9z' fill='%23ff2d3d'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,700;0,800;1,800&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* boot splash: on screen before the game's code (~3 MB) has loaded and started; main.ts fades it out */
      html,
      body {
        margin: 0;
        background: #0d0e11;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        gap: 1.2rem;
        background: radial-gradient(ellipse at 50% 45%, #1b1e25 0%, #0d0e11 75%);
        transition: opacity 0.5s ease;
      }
      #boot.out {
        opacity: 0;
        pointer-events: none;
      }
      #boot .boot-logo {
        font:
          italic 800 3.4rem/0.9 'Barlow Condensed',
          'Arial Narrow',
          sans-serif;
        color: #f2f3f5;
        animation: boot-pulse 1.4s ease-in-out infinite alternate;
      }
      #boot .boot-logo b {
        color: #ff2d3d;
      }
      #boot .boot-bar {
        position: relative;
        height: 3px;
        border-radius: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }
      #boot .boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, #ff2d3d, transparent);
        animation: boot-sweep 1.1s linear infinite;
      }
      @keyframes boot-pulse {
        from {
          opacity: 0.7;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes boot-sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-logo">APEX<b>GHOST</b></div>
      <div class="boot-bar"></div>
    </div>
    <div id="app"></div>
    <noscript>APEX GHOST needs JavaScript and WebGL 2.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
