name = "apex-ghost-server"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "DirectoryDO"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountsDO"

# Free plan: Durable Objects must be SQLite-backed.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# public room list
[[migrations]]
tag = "v2"
new_sqlite_classes = ["DirectoryDO"]

# accounts, friends and records (accounts.ts)
[[migrations]]
tag = "v3"
new_sqlite_classes = ["AccountsDO"]

[observability]
enabled = false
